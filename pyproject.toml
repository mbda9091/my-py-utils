[project]
name = "my-py-utils"
version = "0.1.0"
description = "Personal Python CLI utilities monorepo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"packages/*/src/*/main.py" = ["T201"]
"tests/**/*.py" = ["S101"]
"packages/workspacectl/src/workspacectl/cli.py" = ["T201"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.pyright]
include = ["packages", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
