[project]
name = "mac-cache-cleaner"
version = "0.1.0"
description = "CLI for cleaning macOS build and tool caches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mac-cache-cleaner = "mac_cache_cleaner:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
