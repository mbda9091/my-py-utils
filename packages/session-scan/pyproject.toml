[project]
name = "session-scan"
version = "0.1.0"
description = "Discover local DSH and Codex session files with lazy message readers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zstandard>=0.25.0",
]

[project.scripts]
session-scan = "session_scan.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
