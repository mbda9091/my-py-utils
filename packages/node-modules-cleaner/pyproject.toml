[project]
name = "node-modules-cleaner"
version = "0.1.0"
description = "CLI for recursively deleting node_modules directories under a target path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
node-modules-cleaner = "node_modules_cleaner:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
