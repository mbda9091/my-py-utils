[project]
name = "my-py-utils-cli"
version = "0.1.0"
description = "Aggregate installer for all my-py-utils CLI commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hello-cli",
    "mac-cache-cleaner",
    "node-modules-cleaner",
    "skill-sync",
    "video2audio",
]

[project.scripts]
hello-util = "hello_cli.main:main"
mac-cache-cleaner = "mac_cache_cleaner:main"
node-modules-cleaner = "node_modules_cleaner:main"
skill-sync = "skill_sync.cli:main"
video2audio = "video2audio:main"

[tool.uv.sources]
hello-cli = { workspace = true }
mac-cache-cleaner = { workspace = true }
node-modules-cleaner = { workspace = true }
skill-sync = { workspace = true }
video2audio = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
