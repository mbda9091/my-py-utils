[project]
name = "my-py-utils-cli"
version = "0.1.0"
description = "Aggregate installer for all my-py-utils CLI commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "codex-hook-ctl",
    "codex-session-export",
    "hello-cli",
    "mac-cache-cleaner",
    "node-modules-cleaner",
    "private-pack",
    "repo-security",
    "session-scan",
    "skill-sync",
    "system-alarm",
    "video2audio",
    "workspacectl",
]

[project.scripts]
private-pack = "private_pack.main:main"
codex-hook-ctl = "codex_hook_ctl.cli:main"
codex-session-export = "codex_session_export.main:main"
session-scan = "session_scan.main:main"
hello-util = "hello_cli.main:main"
mac-cache-cleaner = "mac_cache_cleaner:main"
node-modules-cleaner = "node_modules_cleaner:main"
skill-sync = "skill_sync.cli:main"
system-alarm = "system_alarm.main:main"
video2audio = "video2audio:main"
workspacectl = "workspacectl.cli:main"
repo-security = "repo_security.main:main"

[tool.uv.sources]
hello-cli = { workspace = true }
mac-cache-cleaner = { workspace = true }
node-modules-cleaner = { workspace = true }
skill-sync = { workspace = true }
video2audio = { workspace = true }
workspacectl = { workspace = true }
codex-hook-ctl = { workspace = true }
private-pack = { workspace = true }
repo-security = { workspace = true }
codex-session-export = { workspace = true }
system-alarm = { workspace = true }
session-scan = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
