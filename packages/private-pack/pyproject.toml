[project]
name = "private-pack"
version = "0.1.0"
description = "Encrypted per-item archives with a protected name and password manifest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<49",
    "py7zr>=1.1.3,<2",
]

[project.scripts]
private-pack = "private_pack.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
